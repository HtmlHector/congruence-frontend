  <!-- Top Layer: Live Running Web Application -->
  <path d="M16 15.5 L7.5 11 L16 6.5 L24.5 11 Z" fill="url(#layerTop)" stroke="#6ee7b7" stroke-width="1" filter="url(#isoGlow)"/>
